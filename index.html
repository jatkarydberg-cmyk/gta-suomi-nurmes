<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTA Suomi Nurmes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-shell">
      <canvas id="game" width="960" height="540"></canvas>
      <div id="message" class="overlay visible">
        <h1>GTA Suomi Nurmes</h1>
        <p>Kerää rahat, vältä poliiseja ja selviydy 90 sekunnissa.</p>
        <p>Liiku: WASD tai nuolinäppäimet</p>
        <button id="start-button">Aloita peli</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
